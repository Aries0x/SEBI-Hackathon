services:
  # ── FastAPI Backend ────────────────────────────────────────
  - type: web
    name: markettrust-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: FRONTEND_URL
        fromService:
          name: markettrust-frontend
          type: web
          property: url
      - key: CORS_ORIGINS
        value: '["https://markettrust-frontend.onrender.com"]'
      - key: GROQ_API_KEY
        sync: false  # You'll set this manually in the Render dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_PROVIDER
        value: groq
    healthCheckPath: /api/health
    autoDeploy: true

  # ── Next.js Frontend ───────────────────────────────────────
  - type: web
    name: markettrust-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: markettrust-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NODE_ENV
        value: production
    autoDeploy: true
